name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Token discipline and contrast are the two properties that silently rot,
      # so they run before anything slower.
      - name: Token discipline
        run: npm run check:tokens
      - name: Contrast across all three theme states
        run: npm run check:contrast
      - name: Case study standards
        run: npm run check:content

      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
